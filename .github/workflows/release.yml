# Builds privacytk on every supported OS/arch, signs with cosign, and
# uploads the artefacts to the GitHub Release for the tag that triggered
# the run. Internal package repos (apt/dnf/OCI) consume these artefacts
# via the `release-please-config.json` consumer or via direct download
# from the GitHub release tag URL.
#
# Triggered by:
#   - tag push matching `v*` (e.g. v0.1.0, v0.1.1-rc.1)
#
# What it produces per matrix cell:
#   - privacytk-<version>-<target>.tar.gz
#   - privacytk-<version>-<target>.tar.gz.sha256
#   - privacytk-<version>-<target>.tar.gz.sig      (cosign blob signature)
#   - privacytk-<version>-<target>.spdx.json        (SBOM, SPDX 2.3)
#   - privacytk-<version>-<target>.cyclonedx.json   (SBOM, CycloneDX 1.5)
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write
  id-token: write   # required for cosign keyless signing (OIDC)
  packages: write   # required if you also push to GHCR (optional)
  attestations: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  # ---- 1. Build matrix -------------------------------------------------
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (matching Cargo.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.91.0'

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Build (cross-compile on Linux runner for non-native targets)
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-24.04" ]; then
            rustup target add ${{ matrix.target }}
            cargo build --release --target ${{ matrix.target }} --locked
          else
            cargo build --release --locked
          fi

      - name: Stage binary
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            BIN="target/${{ matrix.target }}/release/privacytk.exe"
            ARTIFACT="privacytk-${{ github.ref_name }}-${{ matrix.target }}.zip"
            (cd target/${{ matrix.target }}/release && \
              zip -j ../../$ARTIFACT privacytk.exe)
          else
            BIN="target/${{ matrix.target }}/release/privacytk"
            ARTIFACT="privacytk-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
            tar -C target/${{ matrix.target }}/release -czf $ARTIFACT privacytk
          fi
          sha256sum $ARTIFACT | awk '{print $1}' > $ARTIFACT.sha256
          echo "artifact=$ARTIFACT" >> $GITHUB_OUTPUT

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: privacytk-${{ matrix.target }}
          path: |
            ${{ steps.stage.outputs.artifact }}
            ${{ steps.stage.outputs.artifact }}.sha256

  # ---- 2. SBOM generation (per built artefact) ------------------------
  sbom:
    name: sbom (${{ matrix.target }})
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - x86_64-pc-windows-msvc

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download artefact
        uses: actions/download-artifact@v4
        with:
          name: privacytk-${{ matrix.target }}
          path: dist/

      - name: Generate SBOM with cargo-cyclonedx
        # `cargo-cyclonedx` produces a CycloneDX 1.5 SBOM from Cargo.lock
        # without needing the binary to be installed.
        run: |
          cargo install --locked cargo-cyclonedx --version '^0.5'
          # Convert SBOM to SPDX 2.3 (the other supported format).
          cargo cyclonedx --target ${{ matrix.target }} --format both \
            --output-file dist/privacytk-${{ github.ref_name }}-${{ matrix.target }}

      - name: Sign SBOM (cosign)
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          ARTIFACT=$(ls dist/privacytk-*-${MATRIX_TARGET:-${TARGET}}* | head -1)
          cosign sign-blob --yes \
            --output-signature dist/$(basename $ARTIFACT).sig \
            --bundle dist/$(basename $ARTIFACT).bundle \
            $ARTIFACT

      - name: Upload SBOM + signature
        uses: actions/upload-artifact@v4
        with:
          name: privacytk-sbom-${{ matrix.target }}
          path: dist/

  # ---- 3. Release (consume all artefacts, attach to GitHub Release) -----
  release:
    name: release
    needs: [build, sbom]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: privacytk-*
          merge-multiple: true

      - name: Sign the binary blobs themselves
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          shopt -s nullglob
          for artifact in dist/*.tar.gz dist/*.zip; do
            cosign sign-blob --yes \
              --output-signature "${artifact}.sig" \
              --bundle "${artifact}.bundle" \
              "$artifact"
          done

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: privacytk ${{ github.ref_name }}
          draft: true   # operator promotes manually after review
          generate_release_notes: true
          files: |
            dist/privacytk-*

  # ---- 4. Provenance attestation ---------------------------------------
  attest:
    name: provenance attestation
    needs: [build, sbom]
    runs-on: ubuntu-24.04
    permissions:
      attestations: write

    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: privacytk-x86_64-unknown-linux-gnu
          path: dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/privacytk-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
